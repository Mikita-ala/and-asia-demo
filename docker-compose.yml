name: and-asia

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-andasia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-andasia_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-andasia}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Cache/queues only. Authentication sessions are durable PostgreSQL records.
    command: redis-server --appendonly yes --appendfsync everysec --save 60 1 --save 300 10 --maxmemory-policy noeviction
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  openfga-migrate:
    image: openfga/openfga:v1.10.2
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER:-andasia}:${POSTGRES_PASSWORD:-andasia_local_password}@postgres:5432/openfga?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  openfga:
    image: openfga/openfga:v1.10.2
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER:-andasia}:${POSTGRES_PASSWORD:-andasia_local_password}@postgres:5432/openfga?sslmode=disable
      OPENFGA_LOG_FORMAT: json
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    ports:
      - "${OPENFGA_HTTP_PORT:-8080}:8080"
      - "${OPENFGA_PLAYGROUND_PORT:-13000}:3000"
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
